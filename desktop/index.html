<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badminton Scorer</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14231b;--mu:#5d6f65;--a:#0f8a5f;--b:#e0662b;--bd:#dce5df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#17221c;--tx:#e8f1ec;--mu:#92a69b;--bd:#26362d;--a:#2fc48d;--b:#ff8a4d}}
:root[data-theme="dark"]{--bg:#0e1612;--card:#17221c;--tx:#e8f1ec;--mu:#92a69b;--bd:#26362d;--a:#2fc48d;--b:#ff8a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:600;font-size:15px;padding:10px 6px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--a);color:#fff}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row label{font-size:13px;color:var(--mu);white-space:nowrap}
.row .seg{flex:1}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600;text-align:center}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:12px 8px;text-align:center;user-select:none}
.card.a{border-color:var(--a)}.card.b{border-color:var(--b)}
.nm{font-size:14px;color:var(--mu);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:84px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.a .big{color:var(--a)}.b .big{color:var(--b)}
.tap{display:block;width:100%;margin-top:6px;padding:16px 0;border:0;border-radius:12px;font-size:18px;font-weight:700;color:#fff;cursor:pointer}
.a .tap{background:var(--a)}.b .tap{background:var(--b)}
.tap:disabled{opacity:.4}
.sw{font-size:13px;color:var(--mu);margin-top:4px}
.status{text-align:center;font-weight:700;min-height:24px;margin:6px 0}
.mic{display:block;width:100%;padding:14px;border-radius:12px;border:2px solid var(--a);background:var(--card);color:var(--a);font-size:16px;font-weight:700;cursor:pointer}
.mic.live{background:var(--a);color:#fff}
.heard{text-align:center;font-size:13px;color:var(--mu);min-height:18px;margin:6px 0 0}
.typebox{display:flex;gap:8px;margin-top:8px}
.typebox input{flex:1;width:auto;text-align:left;font-weight:500}
.typebox button{padding:0 18px;border:0;border-radius:10px;background:var(--a);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.typebox select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600}
#winBtn{flex:1;background:var(--card);color:var(--a);border:2px solid var(--a)}
#winBtn.live{background:var(--a);color:#fff}
.ctl{display:flex;gap:10px;margin:8px 0 14px}
.ctl button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.ctl .danger{color:var(--b)}
.hist{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 14px}
.hist div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}
.hist div:last-child{border:0}
.hist .e{color:var(--mu);font-size:14px;border:0}
.pm{display:flex;gap:8px;margin-top:8px}
.pm button{flex:1;padding:14px 0;border:0;border-radius:12px;font-size:24px;font-weight:700;color:#fff;cursor:pointer}
.a .pm button{background:var(--a)}.b .pm button{background:var(--b)}
.pm button.minus{background:var(--bd);color:var(--tx)}
.hide{display:none!important}
</style></head><body>
<div class="wrap">
<h1>🏸 Badminton Scorer</h1>
<div class="seg" id="modes"><button data-m="pts" class="on">Points + Sets</button><button data-m="sets">Sets only</button></div>

<div class="row"><label>Best of</label><div class="seg" id="best"></div></div>
<div class="names"><input id="na" value="Player 1" aria-label="Player 1 name"><input id="nb" value="Player 2" aria-label="Player 2 name"></div>

<div id="status" class="status"></div>
<button class="mic" id="mic">🎤 Start voice</button>
<div class="heard" id="heard">Say the score, e.g. "5 3" or "10 all"</div>
<div class="typebox"><input id="vtxt" placeholder="Type or dictate score (e.g. 5 3), press Enter" aria-label="Score text"><button id="vgo">Go</button></div>
<div class="typebox"><select id="winEvery"><option value="30">Every 30s</option><option value="60">Every 60s</option></select><button id="winBtn">⏱ Auto window: Off</button></div>

<!-- Points mode -->
<div id="pts">
  <div class="board">
    <div class="card a"><div class="nm" id="pa"></div><div class="big" id="sa">0</div><div class="sw" id="wa"></div><button class="tap" id="ba">+1 Point</button></div>
    <div class="card b"><div class="nm" id="pb"></div><div class="big" id="sb">0</div><div class="sw" id="wb"></div><button class="tap" id="bb">+1 Point</button></div>
  </div>
  <div class="ctl"><button id="undo">↶ Undo</button><button id="reset" class="danger">New match</button></div>
  <div class="hist" id="hist"></div>
</div>

<!-- Sets-only mode -->
<div id="sets" class="hide">
  <div class="board">
    <div class="card a"><div class="nm" id="qa"></div><div class="big" id="ta">0</div><div class="pm"><button class="minus" id="ma">−</button><button id="aa">+</button></div></div>
    <div class="card b"><div class="nm" id="qb"></div><div class="big" id="tb">0</div><div class="pm"><button class="minus" id="mb">−</button><button id="ab">+</button></div></div>
  </div>
  <div class="ctl"><button id="reset2" class="danger">New match</button></div>
</div>
</div>

<script>
var bestOf=3, mode='pts';
var P={a:0,b:0}, W={a:0,b:0}, H=[], stack=[], over=false, note='';
var S={a:0,b:0};
var $=function(i){return document.getElementById(i)};
function need(){return Math.floor(bestOf/2)+1}
function nm(k){return ($('n'+k).value.trim())||(k==='a'?'Player 1':'Player 2')}
function setWon(x,y){var m=Math.max(x,y);return (m>=21&&Math.abs(x-y)>=2)||m>=30}

function snap(){stack.push(JSON.stringify({P:P,W:W,H:H,over:over}))}
function point(k){
  if(over)return;
  snap(); P[k]++;
  if(setWon(P.a,P.b)){
    var w=P.a>P.b?'a':'b';
    H.push({a:P.a,b:P.b,w:w}); W[w]++;
    note=nm(w)+' won set '+H.length+' ('+P.a+'–'+P.b+')';
    P={a:0,b:0};
    if(W[w]>=need())over=true;
  }
  render();
}
function undo(){
  if(!stack.length)return;
  var s=JSON.parse(stack.pop()); P=s.P;W=s.W;H=s.H;over=s.over; render();
}
function resetPts(){note='';P={a:0,b:0};W={a:0,b:0};H=[];stack=[];over=false;render()}
function resetSets(){S={a:0,b:0};render()}
function setAdj(k,d){
  var done=S.a>=need()||S.b>=need();
  if(d>0&&done)return;
  S[k]=Math.max(0,Math.min(need(),S[k]+d)); render();
}

function render(){
  var A=nm('a'),B=nm('b');
  ['pa','qa'].forEach(function(i){$(i).textContent=A});
  ['pb','qb'].forEach(function(i){$(i).textContent=B});
  var st=$('status');
  if(mode==='pts'){
    $('sa').textContent=P.a; $('sb').textContent=P.b;
    $('wa').textContent='Sets won: '+W.a; $('wb').textContent='Sets won: '+W.b;
    $('ba').disabled=$('bb').disabled=over;
    var h='';
    H.forEach(function(s,i){h+='<div><span>Set '+(i+1)+'</span><span>'+s.a+' – '+s.b+' · '+(s.w==='a'?A:B)+'</span></div>'});
    $('hist').innerHTML=h||'<div class="e">Completed sets will appear here</div>';
    $('hist').firstChild&&0;
    if(over){var w=W.a>W.b?A:B; st.textContent='🏆 '+w+' wins the match '+W.a+'–'+W.b}
    else{
      var n=H.length+1, extra='';
      if(P.a>=20&&P.b>=20&&P.a!==30&&P.b!==30)extra=' · Deuce (win by 2, max 30)';
      else if(Math.max(P.a,P.b)>=20&&Math.abs(P.a-P.b)>=1)extra=' · '+(P.a>P.b?A:B)+' set point';
      st.textContent=(note&&!P.a&&!P.b?note+' · ':'')+'Set '+n+' of '+bestOf+extra;
    }
  }else{
    $('ta').textContent=S.a; $('tb').textContent=S.b;
    if(S.a>=need()||S.b>=need())st.textContent='🏆 '+(S.a>S.b?A:B)+' wins the match '+S.a+'–'+S.b;
    else st.textContent='First to '+need()+' sets (best of '+bestOf+')';
  }
}

/* ---------- Voice input ---------- */
var rec=null, listening=false;
var WORDS={zero:0,love:0,nil:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30};
function isW(w){return Object.prototype.hasOwnProperty.call(WORDS,w)}
function nums(t){
  var tk=t.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' '),out=[],all=false;
  for(var i=0;i<tk.length;i++){
    var w=tk[i];
    if(w==='all'){all=true;continue}
    if(/^\d+$/.test(w)){out.push(+w);continue}
    if(isW(w)){
      var v=WORDS[w];
      if(v===20&&isW(tk[i+1])&&WORDS[tk[i+1]]>=1&&WORDS[tk[i+1]]<=9){v+=WORDS[tk[++i]]}
      out.push(v);
    }
  }
  return {n:out,all:all};
}
function applyScore(x,y){
  var hd=$('heard');
  if(x>30||y>30){hd.textContent+=' (ignored: max 30)';return}
  if(mode==='pts'){
    if(over)return;
    snap(); P={a:x,b:y};
    if(setWon(P.a,P.b)){
      var w=P.a>P.b?'a':'b';
      H.push({a:P.a,b:P.b,w:w}); W[w]++;
      note=nm(w)+' won set '+H.length+' ('+P.a+'-'+P.b+')';
      P={a:0,b:0};
      if(W[w]>=need())over=true;
    }
  }else{
    if(x>need()||y>need()){hd.textContent+=' (ignored: too many sets)';return}
    S={a:x,b:y};
  }
  render();
}
function splitDigits(d){
  if(d.length===2)return [+d[0],+d[1]];
  if(d.length===3){
    var a=+d.slice(0,2),b=+d.slice(2);
    if(a<=30)return [a,b];
    return [+d[0],+d.slice(1)];
  }
  if(d.length===4)return [+d.slice(0,2),+d.slice(2)];
  return null;
}
function swapNow(){
  if(mode==='pts'){if(over)return;snap();var t1=P.a;P.a=P.b;P.b=t1}
  else{var t2=S.a;S.a=S.b;S.b=t2}
  $('heard').textContent='Heard: play -> score swapped';
  render();
}
function hear(t){
  if(/\bundo\b/i.test(t)){undo();$('heard').textContent='Heard: undo';return}
  var r=nums(t),x,y,sw=/\bplay\b/i.test(t);
  var runs=t.match(/\d+/g);
  if(!r.all&&runs&&runs.length===1&&r.n.length===1){var sp=splitDigits(runs[0]);if(sp)r.n=sp}
  if(r.all&&r.n.length>=1){x=y=r.n[0]}
  else if(r.n.length>=2){x=r.n[0];y=r.n[1]}
  else if(sw){swapNow();return}
  else{$('heard').textContent='Heard: "'+t+'" - please say two numbers';return}
  if(sw){var tp=x;x=y;y=tp}
  $('heard').textContent='Heard: "'+t+'" -> '+x+' - '+y+(sw?' (swapped)':'');
  applyScore(x,y);
}
function setMic(){
  $('mic').textContent=listening?'🎙️ Listening... tap to stop':'🎤 Start voice';
  $('mic').classList.toggle('live',listening);
}
async function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('heard').textContent='Voice not supported here. Open in Chrome.';return}
  var local=false;
  try{
    if(SR.available){
      var s=await Promise.race([
        SR.available({langs:['en-US'],processLocally:true}),
        new Promise(function(r){setTimeout(function(){r('timeout')},1500)})
      ]);
      local=(s==='available');
    }
  }catch(x){}
  rec=new SR(); rec.continuous=true; rec.interimResults=false;
  rec.lang=local?'en-US':'en-IN';
  if(local)rec.processLocally=true;
  rec.onstart=function(){$('heard').textContent=(local?'Offline':'Online')+' voice is listening. Say the score.'};
  rec.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)hear(e.results[i][0].transcript);
    }
  };
  rec.onend=function(){if(listening){try{rec.start()}catch(x){}}};
  rec.onerror=function(e){
    if(e.error==='no-speech'||e.error==='aborted')return;
    listening=false;setMic();
    $('heard').textContent='Voice error: '+e.error+(e.error==='not-allowed'?' (allow the microphone)':'')+(e.error==='network'?' (needs internet)':'');
  };
  listening=true; setMic();
  try{rec.start()}catch(x){$('heard').textContent='Could not start: '+x.message;listening=false;setMic()}
}
$('mic').onclick=function(){
  if(listening){listening=false;if(rec)rec.stop();setMic()}else startMic();
};

var winOn=false,winEvery=30,winTimer=null,winTick=null,winLeft=0,autoT=null;
function submitTxt(){var v=$('vtxt').value.trim();if(!v)return;hear(v);$('vtxt').value='';$('vtxt').focus();if(winLeft>0){clearInterval(winTick);winLeft=0}}
function ready(t){
  if(/\bundo\b|\bplay\b/i.test(t))return true;
  var r=nums(t);
  if(r.all&&r.n.length>=1)return true;
  if(r.n.length>=2)return true;
  var d=t.match(/\d+/g);
  return !!(d&&d.length===1&&r.n.length===1&&d[0].length>=2);
}
function beep(){
  try{var c=new (window.AudioContext||window.webkitAudioContext)();var o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop();c.close()},250)}catch(x){}
  try{if(navigator.vibrate)navigator.vibrate(200)}catch(x){}
}
function showWin(){$('heard').textContent='🎙️ Say the score now ('+winLeft+'s)'}
function closeWin(){clearInterval(winTick);winLeft=0;$('heard').textContent='Window closed. Next one in about '+winEvery+'s'}
function openWin(){
  beep();$('vtxt').focus();winLeft=15;showWin();
  clearInterval(winTick);
  winTick=setInterval(function(){winLeft--;if(winLeft<=0)closeWin();else showWin()},1000);
}
function setWinBtn(){$('winBtn').textContent=winOn?'⏱ Auto window: On':'⏱ Auto window: Off';$('winBtn').classList.toggle('live',winOn)}
function stopWin(){winOn=false;clearInterval(winTimer);clearInterval(winTick);winLeft=0;setWinBtn()}
function startWin(){stopWin();winOn=true;winTimer=setInterval(openWin,winEvery*1000);setWinBtn();openWin()}
$('winBtn').onclick=function(){if(winOn){stopWin();$('heard').textContent='Auto window is off.'}else{winEvery=+$('winEvery').value;startWin()}};
$('winEvery').onchange=function(){winEvery=+$('winEvery').value;if(winOn)startWin()};
$('vtxt').oninput=function(){clearTimeout(autoT);autoT=setTimeout(function(){if(ready($('vtxt').value))submitTxt()},1200)};
$('vgo').onclick=submitTxt;
$('vtxt').onkeydown=function(e){if(e.key==='Enter')submitTxt()};

/* ---------- Local offline voice (only when served from localhost) ---------- */
if(location.hostname==='localhost'||location.hostname==='127.0.0.1'){
  $('mic').classList.add('hide');
  var es=new EventSource('/events');
  es.onopen=function(){$('heard').textContent='Local offline voice connected. Say the score.'};
  var runCmd=function(c){
    var m='Heard "'+(c.said||'')+'" -> ';
    var pl=+c.player===1?'a':'b';
    if(c.action==='point'&&mode==='pts'){point(pl);m+='point to '+nm(pl)}
    else if(c.action==='undo'){undo();m+='undo'}
    else if(c.action==='new_match'){resetPts();S={a:0,b:0};render();m+='new match'}
    else if(c.action==='best_of'){
      var bt=Array.prototype.filter.call(bo.children,function(b){return +b.textContent===+c.n})[0];
      if(bt){bt.click();m+='best of '+c.n}else m+='(best of '+c.n+' not supported)';
    }
    else if(c.action==='score'&&typeof c.a==='number'&&typeof c.b==='number'){applyScore(c.a,c.b);m+='score '+c.a+' - '+c.b}
    else m+='(unclear, nothing changed)';
    $('heard').textContent=m;
  };
  es.addEventListener('cmd',function(e){try{runCmd(JSON.parse(e.data))}catch(x){$('heard').textContent='Could not read command'}});
  es.onmessage=function(e){hear(e.data)};
  es.onerror=function(){$('heard').textContent='Local voice server not running.'};
}

// best-of buttons
var bo=$('best');
[1,3,5,7].forEach(function(n){
  var b=document.createElement('button'); b.textContent=n; if(n===bestOf)b.className='on';
  b.onclick=function(){
    bestOf=n; Array.prototype.forEach.call(bo.children,function(c){c.className=''}); b.className='on';
    resetPts(); S={a:0,b:0}; render();
  };
  bo.appendChild(b);
});
// modes
Array.prototype.forEach.call($('modes').children,function(b){
  b.onclick=function(){
    mode=b.dataset.m;
    Array.prototype.forEach.call($('modes').children,function(c){c.className=''}); b.className='on';
    $('pts').classList.toggle('hide',mode!=='pts'); $('sets').classList.toggle('hide',mode!=='sets');
    render();
  };
});
$('ba').onclick=function(){point('a')}; $('bb').onclick=function(){point('b')};
$('undo').onclick=undo;
function ask(btn,fn){
  if(btn.dataset.armed){clearTimeout(btn._t);btn.dataset.armed='';btn.textContent='New match';fn();return}
  btn.dataset.armed='1';btn.textContent='Tap again to confirm';
  btn._t=setTimeout(function(){btn.dataset.armed='';btn.textContent='New match'},3000);
}
$('reset').onclick=function(){ask($('reset'),resetPts)};
$('reset2').onclick=function(){ask($('reset2'),resetSets)};
$('aa').onclick=function(){setAdj('a',1)}; $('ma').onclick=function(){setAdj('a',-1)};
$('ab').onclick=function(){setAdj('b',1)}; $('mb').onclick=function(){setAdj('b',-1)};
$('na').oninput=$('nb').oninput=render;
render();
</script></body></html>
